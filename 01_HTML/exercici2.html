<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Exercici 2 - Formulari HTML</title>
</head>
<body>
    <h1>Formulari de contacte</h1>
    <form action="#" method="post">
        <label for="nom">Nom:</label><br>
        <input type="text" id="nom" name="nom" required><br><br>
        <label for="email">Correu electrònic:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="missatge">Missatge:</label><br>
        <textarea id="missatge" name="missatge" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Enviar">
    </form>
    <p>*(Aquest formulari no envia res real, és només un exercici)*</p>
</body>
</html>
